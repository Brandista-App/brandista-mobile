name: Android native quality
on:
  pull_request:
    paths: ['apps/mobile/**', 'docs/mobile/**', '.github/workflows/android-quality.yml']
  workflow_dispatch:
    inputs:
      standalone:
        description: Build signed standalone internal APK
        type: boolean
        default: false
      api_base_url:
        description: Real API URL ending in /api/v1 (private IPv4 HTTP permitted only for internal-lan)
        type: string
        required: false
      existing_run_id:
        description: Optional run ID containing a preserved signed APK (verification recovery only)
        type: string
        required: false
      backend_mode:
        description: Backend connection mode
        type: choice
        options: [https, internal-lan, placeholder]
        default: https
permissions:
  contents: read
  actions: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8082/api/v1
      CI: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run dependencies:check
      - run: npx expo-doctor
      - run: npm run bundle:android
  debug-apk:
    if: github.event_name != 'workflow_dispatch' || !inputs.standalone
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            artifact: brandista-android-debug-arm64
          - abi: armeabi-v7a
            artifact: brandista-android-debug-armv7
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8082/api/v1
      CI: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - uses: android-actions/setup-android@v4
      - name: Provision Android compile platform
        run: sdkmanager 'platforms;android-36' 'build-tools;37.0.0'
      - run: npx expo prebuild --platform android --no-install
      - name: Build standard development APK
        run: ./gradlew assembleDebug -PreactNativeArchitectures=${{ matrix.abi }} --no-daemon
        working-directory: apps/mobile/android
      - name: Verify packaged native architecture
        env:
          EXPECTED_ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, struct, zipfile
          apk = pathlib.Path('android/app/build/outputs/apk/debug/app-debug.apk')
          abi = os.environ['EXPECTED_ABI']
          elf_class, machine = {'armeabi-v7a': (1, 40), 'arm64-v8a': (2, 183)}[abi]
          with zipfile.ZipFile(apk) as archive:
              libs = sorted(n for n in archive.namelist() if n.startswith('lib/') and n.endswith('.so'))
              assert libs and {n.split('/')[1] for n in libs} == {abi}, libs
              names = {n.split('/')[-1] for n in libs}
              assert {'libreactnative.so', 'libhermesvm.so', 'libexpo-modules-core.so'} <= names, names
              for name in libs:
                  data = archive.read(name)
                  assert data[:4] == b'\x7fELF' and data[4] == elf_class and data[5] == 1, name
                  assert struct.unpack_from('<H', data, 18)[0] == machine, name
              apk.with_name('native-libraries.txt').write_text('\n'.join(libs) + '\n')
          apk.with_name('apk-sha256.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest() + '  app-debug.apk\n')
          print(f'Verified {len(libs)} native libraries for {abi}')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/android/app/build/outputs/apk/debug/native-libraries.txt
            apps/mobile/android/app/build/outputs/apk/debug/apk-sha256.txt
          if-no-files-found: error

  standalone-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.standalone
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      APP_VARIANT: ${{ inputs.backend_mode == 'internal-lan' && 'internal-lan' || 'internal' }}
      EXPO_PUBLIC_APP_VARIANT: ${{ inputs.backend_mode }}
      BRANDISTA_INTERNAL_BUILD: '1'
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.backend_mode == 'placeholder' && 'https://backend-not-configured.invalid/api/v1' || inputs.api_base_url }}
      CI: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verify reachable backend catalogue
        run: npx tsx scripts/verify-release-backend.ts
        env:
          BACKEND_MODE: ${{ inputs.backend_mode }}
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;37.0.0'
      - name: Recover existing signed APK for verification
        if: inputs.existing_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.existing_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$SOURCE_RUN_ID" --repo Brandista-App/brandista-mobile --name brandista-internal-verification-diagnostics --dir .
          gh api "repos/Brandista-App/brandista-mobile/actions/runs/$SOURCE_RUN_ID" --jq .head_sha > apk-source-sha.txt
      - run: npx expo prebuild --platform android --no-install
        if: inputs.existing_run_id == ''
      - name: Build signed standalone release APK
        id: release-build
        if: inputs.existing_run_id == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_INTERNAL_KEYSTORE_BASE64 }}
          BRANDISTA_STORE_PASSWORD: ${{ secrets.ANDROID_INTERNAL_STORE_PASSWORD }}
          BRANDISTA_KEY_PASSWORD: ${{ secrets.ANDROID_INTERNAL_KEY_PASSWORD }}
          BRANDISTA_KEY_ALIAS: brandista-internal
          BRANDISTA_KEYSTORE_PATH: ${{ runner.temp }}/brandista-internal.jks
        run: |
          set -euo pipefail
          trap 'rm -f "$BRANDISTA_KEYSTORE_PATH"' EXIT
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$BRANDISTA_KEYSTORE_PATH"
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon
      - name: Verify both native architectures
        run: python3 scripts/verify-internal-apk.py android/app/build/outputs/apk/release/app-release.apk
      - name: Verify embedded JavaScript and release signing
        env:
          BACKEND_MODE: ${{ inputs.backend_mode }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -l "$apk" | grep 'assets/index.android.bundle'
          unzip -p "$apk" assets/index.android.bundle > "$RUNNER_TEMP/brandista-bundle"
          grep -aFq "$EXPO_PUBLIC_API_BASE_URL" "$RUNNER_TEMP/brandista-bundle"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk" | tee signing-report.txt
          grep -Fq 'certificate SHA-256 digest: d75128ac92091d2b837368071d41f3a36c2036ecfa42409d06cdda0b7be4fa44' signing-report.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" > apk-metadata.txt
          if grep -q 'application-debuggable' apk-metadata.txt; then exit 1; fi
          if [ "$BACKEND_MODE" = internal-lan ]; then
            grep -q "package: name='com.brandista.mobile.internal'" apk-metadata.txt
            python3 scripts/verify-apk-network.py "$apk"

          else
            grep -q "package: name='com.brandista.mobile.internal'" apk-metadata.txt
            python3 scripts/verify-apk-network.py "$apk"
          fi
          sha256sum "$apk" > apk-sha256.txt
          APK_SOURCE_SHA="$GITHUB_SHA"
          if [ -f apk-source-sha.txt ]; then APK_SOURCE_SHA=$(cat apk-source-sha.txt); fi
          printf 'APK source: %s\nVerification source: %s\nAPI: %s\nLAN reachability: requires local setup and phone verification\nDevice launch: not verified by this workflow\n' "$APK_SOURCE_SHA" "$GITHUB_SHA" "$EXPO_PUBLIC_API_BASE_URL" > build-evidence.txt
      - uses: actions/upload-artifact@v7
        with:
          name: brandista-android-internal-signed-universal
          retention-days: 14
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/signing-report.txt
            apps/mobile/apk-metadata.txt
            apps/mobile/apk-sha256.txt
            apps/mobile/build-evidence.txt
            apps/mobile/network-security.txt
            apps/mobile/native-libraries.json
          if-no-files-found: error
      - name: Preserve built APK for diagnostics if verification fails
        if: failure() && steps.release-build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: brandista-internal-verification-diagnostics
          retention-days: 3
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/signing-report.txt
            apps/mobile/apk-metadata.txt
          if-no-files-found: error
