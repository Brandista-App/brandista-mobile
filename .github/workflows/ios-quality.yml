name: iOS foundation quality
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/brand-assets/**'
      - 'docs/mobile/IOS-001*'
      - 'docs/mobile/IOS-002*'
      - '.github/workflows/ios-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: development
      EXPO_PUBLIC_APP_ENV: development
      # Non-routable placeholder: static validation/export only, no API acceptance claim.
      EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run dependencies:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run config:check
      - run: npm run bundle:ios
      # No EAS account, signing credentials, native build, or deployment in this workflow.
